[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "identityexcess"
version = "0.0.1-pre"
authors = [
  {name = "Suting Li, Jinhua Tian et al.", email = "drhongli77@163.com"}
]
description = "Pre-release toolkit for identity-excess-law: fibroblast stromal signature de-confounding"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "scikit-learn>=1.1"
]

[project.urls]
"Homepage" = "https://github.com/francishsm/identityexcess"
"Bug Tracker" = "https://github.com/francishsm/identityexcess/issues"
"Manuscript Reproducibility (Zenodo)" = "https://doi.org/10.5281/zenodo.24487895"
